<meta name="theme-color" content="#0f1419">
<title>Part 107 Study App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {

    background: #0f1419;

  }
  .app {

    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    padding-left: calc(20px + env(safe-area-inset-left));
    padding-right: calc(20px + env(safe-area-inset-right));
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.8rem;
    color: #4fc3f7;
    margin-bottom: 4px;
  }
  header p {
    color: #888;
    font-size: 0.9rem;
  }
  .topic-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    background: #1a2027;
    padding: 8px;
    border-radius: 10px;
  }
  .topic-bar button {
    flex: 1;
    min-width: 120px;
    padding: 10px 12px;
    background: transparent;
    color: #aaa;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .topic-bar button:hover { background: #222a33; color: #fff; }
  .topic-bar button.active { background: #4fc3f7; color: #0f1419; }
  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2a3540;
  }
  .tab-bar button {
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    color: #888;
    border: none;
    border-bottom: 2px solid transparent;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-bar button:hover { color: #fff; }
  .tab-bar button.active {
    color: #4fc3f7;
    border-bottom-color: #4fc3f7;
  }
  .content { min-height: 400px; }
  .card {
    background: #1a2027;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .flashcard {
    background: #1a2027;
    border-radius: 10px;
    padding: 32px;
    margin-bottom: 16px;
    min-height: 220px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .flashcard:hover { background: #1f2731; }
  .flashcard .label {
    font-size: 0.75rem;
    color: #4fc3f7;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .flashcard .term {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .flashcard .definition {
    font-size: 1rem;
    color: #ccc;
  }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .nav-row button {
    padding: 8px 16px;
    background: #2a3540;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .nav-row button:hover:not(:disabled) { background: #3a4550; }
  .nav-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .counter {
    color: #888;
    font-size: 0.85rem;
  }
  .question {
    font-size: 1.05rem;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    padding: 12px 16px;
    background: #232c36;
    border: 2px solid transparent;
    border-radius: 8px;
    color: #e6e6e6;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.95rem;
  }
  .option:hover:not(:disabled) { background: #2a3540; }
  .option.correct {
    background: #1e3a2a;
    border-color: #4caf50;
  }
  .option.incorrect {
    background: #3a1e1e;
    border-color: #f44336;
  }
  .option:disabled { cursor: not-allowed; }
  .explanation {
    margin-top: 16px;
    padding: 14px;
    background: #232c36;
    border-radius: 8px;
    border-left: 3px solid #4fc3f7;
    font-size: 0.9rem;
    color: #ccc;
  }
  .pill-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .pill {
    padding: 6px 14px;
    background: #232c36;
    border: 1px solid #2a3540;
    border-radius: 16px;
    color: #ccc;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .pill:hover { background: #2a3540; }
  .pill.active { background: #4fc3f7; color: #0f1419; border-color: #4fc3f7; }
  .breakdown h3 {
    color: #4fc3f7;
    margin-bottom: 12px;
    font-size: 1.1rem;
  }
  .breakdown p { margin-bottom: 10px; color: #ddd; }
  .breakdown ul { margin: 8px 0 12px 20px; }
  .breakdown li { margin-bottom: 4px; color: #ccc; }
  .breakdown strong { color: #fff; }
  .reference {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .ref-item {
    background: #232c36;
    padding: 14px;
    border-radius: 8px;
    border-left: 3px solid #4fc3f7;
  }
  .ref-item h4 {
    color: #4fc3f7;
    font-size: 0.95rem;
    margin-bottom: 6px;
  }
  .ref-item p { font-size: 0.9rem; color: #ccc; }
  .stats {
    background: #1a2027;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-around;
    font-size: 0.85rem;
  }
  .stat { text-align: center; }
  .stat-val { color: #4fc3f7; font-weight: 600; font-size: 1.1rem; }
  .stat-label { color: #888; }
  @media (max-width: 600px) {
    .app {
      padding: 12px;
      padding-top: calc(12px + env(safe-area-inset-top));
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      padding-left: calc(12px + env(safe-area-inset-left));

    .flashcard { padding: 24px 16px; }
    .flashcard .term { font-size: 1.2rem; }
  }
</style>

const TOPIC_ORDER = ["regulations", "airspace", "weather", "loading", "operations"];
const TABS = [

  { id: "questions", name: "Practice" },
  { id: "topics", name: "Breakdown" },
  { id: "reference", name: "Reference" }
];

const state = {
  topic: "regulations",
  tab: "flashcards",
  flashIndex: 0,
  flashFlipped: false,
  qIndex: 0,
  qAnswered: false,
  qSelected: null,
  qCorrect: 0,
  qTotal: 0,
  topicSub: 0
};

function renderTopicBar() {
  const bar = document.getElementById("topicBar");
  bar.innerHTML = "";
  TOPIC_ORDER.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = DATA[t].name;
    if (state.topic === t) btn.classList.add("active");
    btn.onclick = () => {
      state.topic = t;
      state.flashIndex = 0;
      state.flashFlipped = false;
      state.qIndex = 0;
      state.qAnswered = false;
      state.qSelected = null;
      state.qCorrect = 0;
      state.qTotal = 0;
      state.topicSub = 0;
      renderAll();
    };
    bar.appendChild(btn);
  });
}

function renderTabBar() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  TABS.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t.name;
    if (state.tab === t.id) btn.classList.add("active");
    btn.onclick = () => { state.tab = t.id; renderContent(); };
    bar.appendChild(btn);
  });
}

function renderContent() {
  const el = document.getElementById("content");
  el.innerHTML = "";
  const data = DATA[state.topic];
  if (state.tab === "flashcards") renderFlashcards(el, data);
  else if (state.tab === "questions") renderQuestions(el, data);
  else if (state.tab === "topics") renderTopics(el, data);
  else renderReference(el, data);
}

function renderFlashcards(el, data) {
  const cards = data.flashcards;
  const c = cards[state.flashIndex];
  const card = document.createElement("div");
  card.className = "flashcard";
  if (!state.flashFlipped) {
    card.innerHTML = `<div class="label">Term</div><div class="term">${c.term}</div><div class="definition" style="color:#888;font-size:0.85rem;margin-top:16px;">Tap to reveal</div>`;
  } else {
    card.innerHTML = `<div class="label">Definition</div><div class="term" style="font-size:1.1rem;">${c.term}</div><div class="definition" style="margin-top:12px;">${c.def}</div>`;
  }
  card.onclick = () => { state.flashFlipped = !state.flashFlipped; renderContent(); };
  el.appendChild(card);

  const nav = document.createElement("div");
  nav.className = "nav-row";
  const prev = document.createElement("button");
  prev.textContent = "← Prev";
  prev.disabled = state.flashIndex === 0;
  prev.onclick = () => { state.flashIndex--; state.flashFlipped = false; renderContent(); };
  const counter = document.createElement("span");
  counter.className = "counter";
  counter.textContent = `${state.flashIndex + 1} / ${cards.length}`;
  const next = document.createElement("button");
  next.textContent = "Next →";
  next.disabled = state.flashIndex === cards.length - 1;
  next.onclick = () => { state.flashIndex++; state.flashFlipped = false; renderContent(); };
  nav.append(prev, counter, next);
  el.appendChild(nav);
}

function renderQuestions(el, data) {
  const qs = data.questions;
  const q = qs[state.qIndex];

  if (state.qTotal > 0) {
    const stats = document.createElement("div");
    stats.className = "stats";
    stats.innerHTML = `
      <div class="stat"><div class="stat-val">${state.qCorrect}</div><div class="stat-label">Correct</div></div>
      <div class="stat"><div class="stat-val">${state.qTotal}</div><div class="stat-label">Answered</div></div>
      <div class="stat"><div class="stat-val">${Math.round((state.qCorrect/state.qTotal)*100)}%</div><div class="stat-label">Score</div></div>
    `;
    el.appendChild(stats);
  }

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="question">${state.qIndex + 1}. ${q.q}</div>`;
  const opts = document.createElement("div");
  opts.className = "options";
  q.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
    b.disabled = state.qAnswered;
    if (state.qAnswered) {
      if (i === q.correct) b.classList.add("correct");
      else if (i === state.qSelected) b.classList.add("incorrect");
    }
    b.onclick = () => {
      if (state.qAnswered) return;
      state.qSelected = i;
      state.qAnswered = true;
      state.qTotal++;
      if (i === q.correct) state.qCorrect++;
      renderContent();
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if (state.qAnswered) {
    const exp = document.createElement("div");
    exp.className = "explanation";
    exp.innerHTML = `<strong>${state.qSelected === q.correct ? "Correct" : "Incorrect"}.</strong> ${q.exp}`;
    card.appendChild(exp);
  }
  el.appendChild(card);

  const nav = document.createElement("div");
  nav.className = "nav-row";
  const prev = document.createElement("button");
  prev.textContent = "← Prev";
  prev.disabled = state.qIndex === 0;
  prev.onclick = () => {
    state.qIndex--;
    state.qAnswered = false;
    state.qSelected = null;
    renderContent();
  };
  const counter = document.createElement("span");
  counter.className = "counter";
  counter.textContent = `${state.qIndex + 1} / ${qs.length}`;
  const next = document.createElement("button");
  next.textContent = "Next →";
  next.disabled = state.qIndex === qs.length - 1;
  next.onclick = () => {
    state.qIndex++;
    state.qAnswered = false;
    state.qSelected = null;
    renderContent();
  };
  nav.append(prev, counter, next);
  el.appendChild(nav);
}

function renderTopics(el, data) {
  const pills = document.createElement("div");
  pills.className = "pill-row";
  data.topics.forEach((t, i) => {
    const p = document.createElement("div");
    p.className = "pill";
    p.textContent = t.name;
    if (i === state.topicSub) p.classList.add("active");
    p.onclick = () => { state.topicSub = i; renderContent(); };
    pills.appendChild(p);
  });
  el.appendChild(pills);

  const card = document.createElement("div");
  card.className = "card breakdown";
  card.innerHTML = data.topics[state.topicSub].content;
  el.appendChild(card);
}

function renderReference(el, data) {
  const grid = document.createElement("div");
  grid.className = "reference";
  data.reference.forEach(r => {
    const item = document.createElement("div");
    item.className = "ref-item";
    item.innerHTML = `<h4>${r.title}</h4><p>${r.body}</p>`;
    grid.appendChild(item);
  });
  el.appendChild(grid);
}

function renderAll() {
  renderTopicBar();
  renderTabBar();
  renderContent();
}

renderAll();
</script>
</body>
</html>
